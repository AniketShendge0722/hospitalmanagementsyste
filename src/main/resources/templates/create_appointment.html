<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Appointment</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/">
            <i class="fas fa-hospital"></i> HMS
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">
                        <i class="fas fa-home"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/patients">
                        <i class="fas fa-users"></i> Patients
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/doctors">
                        <i class="fas fa-user-md"></i> Doctors
                    </a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="/appointments">
                        <i class="fas fa-calendar-check"></i> Appointments
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="form-section">
        <div class="form-card">
            <!-- Page Header -->
            <div class="form-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h2>
                        <i class="fas fa-calendar-plus"></i> Create New Appointment
                    </h2>
                </div>
            </div>

            <!-- Appointment Form -->
            <form th:action="@{/appointments}" th:object="${appointment}" method="post" class="appointment-form">

                <!-- Patient Selection -->
                <div class="form-group">
                    <label for="patientName" class="form-label">
                        <i class="fas fa-user"></i> Patient
                    </label>
                    <select id="patientName" th:field="*{patientName}" class="form-control form-control-modern" required>
                        <option value="">-- Select Patient --</option>
                        <option th:each="patient : ${patients}"
                                th:value="${patient.firstName + ' ' + patient.lastName}"
                                th:text="${patient.firstName + ' ' + patient.lastName}">
                        </option>
                    </select>
                    <div class="error-text" th:if="${#fields.hasErrors('patientName')}" th:errors="*{patientName}">
                        Patient is required
                    </div>
                </div>

                <!-- Doctor Selection -->
                <div class="form-group">
                    <label for="doctorName" class="form-label">
                        <i class="fas fa-user-md"></i> Doctor
                    </label>
                    <select id="doctorName" th:field="*{doctorName}" class="form-control form-control-modern" required>
                        <option value="">-- Select Doctor --</option>
                        <option th:each="doctor : ${doctors}"
                                 th:value="${doctor.doctorName}"
                                th:text="${doctor.doctorName}">
                        </option>
                    </select>
                    <div class="error-text" th:if="${#fields.hasErrors('doctorName')}" th:errors="*{doctorName}">
                        Doctor is required
                    </div>
                </div>

                <!-- Appointment Date -->
                <div class="form-group">
                    <label for="appointmentDate" class="form-label">
                        <i class="fas fa-calendar"></i> Appointment Date
                    </label>
                    <input type="date" id="appointmentDate" th:field="*{appointmentDate}" class="form-control form-control-modern" required>
                    <div class="error-text" th:if="${#fields.hasErrors('appointmentDate')}" th:errors="*{appointmentDate}">
                        Appointment Date is required
                    </div>
                </div>

                <!-- Time Slot -->
                <div class="form-group">
                    <label for="timeSlot" class="form-label">
                        <i class="fas fa-clock"></i> Time Slot
                    </label>
                    <input type="time" id="timeSlot" th:field="*{timeSlot}" class="form-control form-control-modern" required>
                    <div class="error-text" th:if="${#fields.hasErrors('timeSlot')}" th:errors="*{timeSlot}">
                        Time Slot is required
                    </div>
                </div>

                <!-- Status -->
                <div class="form-group">
                    <label for="status" class="form-label">
                        <i class="fas fa-info-circle"></i> Status
                    </label>
                    <select id="status" th:field="*{status}" class="form-control form-control-modern" required>
                        <option value="">-- Select Status --</option>
                        <option value="PENDING">Pending</option>
                        <option value="CONFIRMED">Confirmed</option>
                        <option value="CANCELLED">Cancelled</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                    <div class="error-text" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">
                        Status is required
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="form-button-group">
                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="fas fa-save"></i> Save Appointment
                    </button>
                    <button type="reset" class="btn btn-warning btn-lg">
                        <i class="fas fa-redo"></i> Reset
                    </button>
                    <a href="/appointments" class="btn btn-secondary btn-lg">
                        <i class="fas fa-arrow-left"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
