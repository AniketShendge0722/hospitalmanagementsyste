<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Doctor</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        /* Add any custom styles here if needed, or reuse existing ones */
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .card-header {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/">HMS</a>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="/patients">Patients</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/doctors">Doctors</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-lg-6 col-md-8 mx-auto">
            <button onclick="history.back()" class="btn btn-secondary mb-3">Go Back</button>

            <div class="card">
                <div class="card-header">
                    <h2 class="text-center">Add New Doctor</h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/doctors}" th:object="${doctor}" method="POST">
                        <div class="form-group">
                            <label for="doctorName">Doctor Name</label>
                            <input type="text" id="doctorName" name="doctorName" th:field="*{doctorName}"
                                   class="form-control" placeholder="Enter Doctor Name" required>
                            <p th:if="${#fields.hasErrors('doctorName')}" th:errors="*{doctorName}" class="text-danger"></p>
                        </div>

                        <div class="form-group">
                            <label for="specialization">Specialization</label>
                            <input type="text" id="specialization" name="specialization" th:field="*{specialization}"
                                   class="form-control" placeholder="Enter Doctor Specialization" required>
                            <p th:if="${#fields.hasErrors('specialization')}" th:errors="*{specialization}" class="text-danger"></p>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" th:field="*{email}"
                                   class="form-control" placeholder="Enter Doctor Email" required>
                            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></p>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="text" id="phone" name="phone" th:field="*{phone}"
                                   class="form-control" placeholder="Enter Doctor Phone Number" required>
                            <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger"></p>
                        </div>

                        <div class="box-footer text-center">
                            <button type="submit" class="btn btn-primary">Submit</button>
                            <a th:href="@{/doctors}" class="btn btn-secondary ml-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
